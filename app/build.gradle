plugins {
    id 'com.android.application'
}

def testKeyStore = rootProject.file("signing/test-key.p12")

android {
    namespace 'com.v8td.batterywidget'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.v8td.batterywidget"
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName "0.85"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        testKey {
            storeFile testKeyStore
            storeType "PKCS12"
            storePassword "qbattery"
            keyAlias "qbattery"
            keyPassword "qbattery"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (testKeyStore.exists()) signingConfig signingConfigs.testKey
        }
        release {
            minifyEnabled false
            if (testKeyStore.exists()) signingConfig signingConfigs.testKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Q-battery-${variant.versionName}.apk"
        }
    }
}
