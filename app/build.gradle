plugins {
    id 'com.android.application'
}

android {
    namespace 'com.v8td.batterywidget'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.v8td.batterywidget"
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName "0.3"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Q-battery-${variant.versionName}.apk"
        }
    }
}
