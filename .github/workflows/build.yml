name: Build Q-battery

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$V" ]; then
            echo "Не нашёл versionName в app/build.gradle"
            exit 1
          fi
          echo "name=Q-battery-$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Stable test signing key
        run: |
          mkdir -p signing
          if [ ! -f signing/test-key.b64 ]; then
            keytool -genkeypair -keystore signing/test-key.p12 -storetype PKCS12 \
              -storepass qbattery -keypass qbattery -alias qbattery \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Q-battery Test, O=Q-battery, C=RU"
            base64 -w 0 signing/test-key.p12 > signing/test-key.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/test-key.b64
            git commit -m "Add stable test signing key [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::key not saved"
          fi
          base64 -d signing/test-key.b64 > signing/test-key.p12

      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/
          ls -l out

      - name: Prepare sources
        run: |
          mkdir -p out/src
          git archive --format=tar HEAD | tar -xf - -C out/src
          ls -la out/src

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}-source
          path: out/src
          include-hidden-files: true
          if-no-files-found: error
