name: Build Q-battery

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/
          ls -l out

      - name: Pack sources
        run: |
          zip -r out/Q-battery-source.zip . -x ".git/*" "out/*" "build/*" "app/build/*" ".gradle/*"

      - uses: actions/upload-artifact@v4
        with:
          name: Q-battery-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Q-battery-source
          path: out/Q-battery-source.zip
